<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{TITLE}}</title>
    <style>
        body { font-family: "微软雅黑", "Microsoft YaHei", sans-serif; max-width: 1000px; margin: 30px auto; padding: 0 20px; color: #2c3e50; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h2 { color: #2c3e50; margin-top: 28px; }
        .summary-box { background-color: #f8f9fa; padding: 15px; border-radius: 6px; margin: 20px 0; border-left: 4px solid #f39c12; }
        .summary-box p { margin: 0; line-height: 1.8; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { padding: 12px 15px; text-align: left; border: 1px solid #ddd; vertical-align: top; line-height: 1.6; }
        th { background-color: #3498db; color: white; }
        .pass { color: #27ae60; font-weight: bold; }
        .warning { color: #e74c3c; font-weight: bold; }
        ul { line-height: 1.9; }
        .suggestion { background-color: #fff3cd; padding: 12px; border-radius: 6px; margin-top: 20px; line-height: 1.8; }
    </style>
</head>
<body>
    <h1>{{TITLE}}</h1>
    <div class="summary-box">
        <p>{{SUMMARY}}</p>
    </div>
    <h2>校验明细</h2>
    <table>
        <thead>
            <tr>
                <th>序号</th>
                <th>审核要素</th>
                <th>判断规则</th>
                <th>结果</th>
            </tr>
        </thead>
        <tbody>{{ROWS}}</tbody>
    </table>
    <h2>汇总说明</h2>
    <ul>{{FACTS}}</ul>
    <div class="suggestion">
        <strong>整改建议：</strong>{{SUGGESTION}}
    </div>
</body>
</html>
